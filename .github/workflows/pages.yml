# Build the Eleventy site and deploy it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# Optional repo variables (Settings > Secrets and variables > Actions > Variables):
#   SITE_URL     default https://adamheise-stack.github.io/scottpcsguide
#   PATH_PREFIX  default /scottpcsguide/; set "/" for a custom domain
#   CF_ANALYTICS_TOKEN  optional Cloudflare Web Analytics token
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday ~6:23 AM Central. Offset from :00 because GitHub can skip
    # top-of-hour schedules under load and will not retry until next week.
    - cron: "23 11 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://adamheise-stack.github.io/scottpcsguide' }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: npx eleventy --pathprefix="${{ vars.PATH_PREFIX || '/scottpcsguide/' }}"
      - name: Check links, disclaimers, sponsored rel
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://adamheise-stack.github.io/scottpcsguide' }}
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/scottpcsguide/' }}
        run: node scripts/check-links.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
